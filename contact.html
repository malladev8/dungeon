<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Astral Arcs - Contact</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/tabs.js"></script>
</head>
<body>
    <!-- Tab Navigation -->
    <nav-tabs></nav-tabs>

    <form action="https://formspree.io/f/xaewkqya" method="POST">

    <!-- Tab Content -->
    <main class="contact-page">

        <section class="contact-intro">

            <h1>Ready to Begin Your Adventure?</h1>

            <p>
                Whether you're looking to join a campaign,
                gather your own party for a private adventure, or
                plan a special one-shot, I'd love to hear from you.
            </p>

            <p>
                Fill out the form below and I'll get back to you
                as soon as possible.
            </p>
        </section>


        <section class="contact-form-section">

            <form id="contactForm">

                <div class="form-group">
                    <label for="name">Name</label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        required>
                </div>


                <div class="form-group">
                    <label for="email">Email</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        required>
                </div>


                <div class="form-group">

                    <label for="lookingFor">
                        What are you looking for?
                    </label>

                    <select id="lookingFor" name="lookingFor" required>

                        <option value="">
                            Select an option
                        </option>

                        <option value="existing">
                            Join a campaign as an individual player
                        </option>

                        <option value="private">
                            Private campaign for my group
                        </option>

                        <option value="oneshot">
                            One-shot
                        </option>

                        <option value="other">
                            Something else
                        </option>

                    </select>
                </div>


                <div class="form-group">

                    <label for="players">
                        Number of Players
                    </label>

                    <input
                        type="number"
                        id="players"
                        name="players"
                        min="1"
                        max="10"
                        required>
                </div>


                <div class="form-group">

                    <label for="format">
                        Online or In-Person?
                    </label>

                    <select id="format" name="format" required>

                        <option value="">
                            Select an option
                        </option>

                        <option value="online">
                            Online
                        </option>

                        <option value="in-person">
                            In-person
                        </option>

                        <option value="either">
                            Either
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="experience">
                        Experience Level
                    </label>

                    <select id="experience" name="experience">

                        <option value="">
                            Select an option
                        </option>

                        <option value="new">
                            Brand new
                        </option>

                        <option value="some">
                            Some experience
                        </option>

                        <option value="experienced">
                            Experienced
                        </option>

                        <option value="mixed">
                            Mixed group
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="availability">
                        Preferred Days / Times
                    </label>

                    <textarea
                        id="availability"
                        name="availability"
                        rows="3"
                        placeholder="For example: Friday evenings after 6pm"></textarea>

                </div>


                <div class="form-group">

                    <label for="additional">
                        Anything else you'd like me to know?
                    </label>

                    <textarea
                        id="additional"
                        name="additional"
                        rows="4"></textarea>

                </div>


                <button type="submit">
                    Submit
                </button>

            </form>

        </section>

    </main>

</body>
</html>
